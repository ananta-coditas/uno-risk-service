# Grype ignores: see each `reason`. Dockerfile-listed CVEs (OpenJDK/libpng, giflib, libarchive, libnghttp2, python3,
# perl-XML-Parser, libcap, Go/SRPM tooling) are accepted when full vendor remediation would impact service or image functionality.
# CVE-2026-6100: CPython RPMs on Rocky 9 (matched as redhat:distro:redhat:9); scoped by namespace + rpm + package name.
# See Dockerfile stage 2 for package constraints and build steps.
# CVE-2026-4111 / CVE-2026-4424: libarchive RAR/RAR5; additional libarchive entries above.
# CVE-2026-4775 (libtiff) / CVE-2026-33412 / CVE-2026-34982 (vim-minimal): accepted-risk; refresh when Rocky ships patched RPMs.
# CVE-2026-4786: CPython webbrowser.open (CVE-2026-4519 follow-on) on Rocky 9 python3/python3-libs RPMs only; scoped like CVE-2026-6100.
# Rocky 9 OS RPMs (glibc/OpenJDK/binutils/libpng): CVE-2026-5358, CVE-2026-34282, CVE-2026-22016, CVE-2026-6846, CVE-2026-22020 — see ignores at end of list.
ignore:
  - vulnerability: CVE-2025-66293
    reason: "Accepted: full remediation would impact service functionality (OpenJDK/libpng stack); see Dockerfile"
  - vulnerability: CVE-2026-25646
    reason: "Accepted: full remediation would impact service functionality (OpenJDK/libpng stack); see Dockerfile"
  - vulnerability: CVE-2026-4111
    reason: "Accepted: libarchive RAR5 DoS; service does not decompress user-supplied RAR/RAR5; base image will get patched libarchive via dnf update when available"
  - vulnerability: CVE-2026-4424
    reason: "Accepted: libarchive remediation would impact service functionality; refresh when Rocky ships a non-breaking fix"
  - vulnerability: CVE-2026-26740
    reason: "Accepted: giflib/OpenJDK remediation path would impact service functionality; see Dockerfile"
  - vulnerability: CVE-2026-23868
    reason: "Accepted: giflib remediation would impact service functionality; see Dockerfile"
  - vulnerability: CVE-2006-10003
    reason: "Accepted: perl-XML-Parser upgrade/fix would impact service functionality; see Dockerfile (CVE id as in Dockerfile comments)"
  - vulnerability: CVE-2026-27135
    reason: "Accepted: libnghttp2 remediation would impact service functionality; refresh when distro ships compatible fix"
  - vulnerability: CVE-2026-4519
    reason: "Accepted: python3/python3-libs remediation would impact service functionality; see Dockerfile"
  - vulnerability: CVE-2026-6100
    namespace: redhat:distro:redhat:9
    package:
      type: rpm
      name: (python3|python3-libs)
    reason: "Accepted: CVE-2026-6100 (CPython decompressor UAF after MemoryError on instance reuse) on Rocky 9 OS python3/python3-libs only; Grype maps Rocky 9 RPMs to redhat:distro:redhat:9. Workload is Java+R, not reusing Python decompressors; remove when Rocky ships patched RPMs."
  - vulnerability: CVE-2026-4786
    namespace: redhat:distro:redhat:9
    package:
      type: rpm
      name: (python3|python3-libs)
    reason: "Accepted: CVE-2026-4786 (incomplete mitigation for CVE-2026-4519 — webbrowser.open() shell command injection via crafted URL including %action) on Rocky 9 OS python3/python3-libs only. Workload is Java+R with no Python webbrowser path on attacker-controlled URLs; remove when Rocky ships patched RPMs."
  - vulnerability: CVE-2026-4775
    reason: "Accepted: libtiff crafted TIFF heap write; service does not decode untrusted TIFFs; transitive OS RPM — refresh libtiff when Rocky errata ships"
  - vulnerability: CVE-2026-33412
    reason: "Accepted: vim glob() newline command injection (patched Vim 9.2.0202+); non-interactive runtime, no untrusted vim/automation path — refresh vim-minimal when distro ships fix"
  - vulnerability: CVE-2026-34982
    namespace: redhat:distro:redhat:9
    package:
      type: rpm
      name: vim-minimal
    reason: "Accepted: CVE-2026-34982 (Vim modeline sandbox bypass — arbitrary OS command execution when opening a crafted file; fixed Vim 9.2.0276+) on Rocky 9 vim-minimal RPM only. Headless Java+R runtime — no interactive vim or user opening untrusted files; refresh when Rocky ships patched vim-minimal."
  - vulnerability: CVE-2026-4046
    reason: "glibc/glibc-common/glibc-gconv-extra/glibc-minimal-langpack are OS RPMs from Rocky 9 repos; image build runs dnf update for latest vendor-fixed/backported builds. Keep upgrading base image and remove this ignore once Rocky publishes explicit errata mapping for this CVE."
  - vulnerability: CVE-2026-34714
    reason: "Mitigated in workload: vim-minimal is explicitly removed from runtime image in Dockerfile and not required by service execution."
  - vulnerability: CVE-2026-4878
    reason: "Accepted: libcap vendor remediation path would impact service functionality; see Dockerfile (custom libcap build)"
  - vulnerability: CVE-2026-25679
    reason: "Accepted: Go/SRPM-related finding (e.g. go-srpm-macros); removing build tooling or forcing upgrades would impact image build/functionality; see Dockerfile R-core-devel removal notes"
  - vulnerability: CVE-2026-5358
    reason: "Rocky 9 OS RPMs (glibc family): NVD rejected CVE-2026-5358 (glibc NIS+ / trust-boundary dispute); Grype may still match distro glibc — remove ignore if policy requires zero matches or when Rocky/errata explicitly addresses feed"
  - vulnerability: CVE-2026-34282
    reason: "Rocky 9 OS RPM java-21-openjdk-headless (Oracle CPU Apr 2026 class); remediate via dnf update when Rocky ships patched OpenJDK 21 RPMs — remove this ignore after image rebuild on fixed errata"
  - vulnerability: CVE-2026-22016
    reason: "Rocky 9 OS RPM java-21-openjdk-headless (Oracle CPU Apr 2026 / JAXP); remediate via dnf update when Rocky ships patched OpenJDK 21 RPMs — remove this ignore after image rebuild on fixed errata"
  - vulnerability: CVE-2026-6846
    reason: "Rocky 9 OS RPMs binutils / binutils-gold (transitive toolchain, e.g. R-core-devel); remediate when Rocky ships patched RPMs via dnf update — remove ignore once scanner clean on updated base"
  - vulnerability: CVE-2026-22020
    reason: "Rocky 9 OS RPMs (java-21-openjdk-headless and/or libpng per scanner CPE); remediate via vendor RPM updates when Rocky publishes fixes — remove ignore after dnf update + rebuild clears findings"
