# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

spring:
  application:
    name: uno-web-biolerplate
  cloud:
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    serialization:
      write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: uno-web-biolerplate-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: uno-web-biolerplate-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

uno:
  clientApp:
    name: 'uno-web-biolerplate'
  mail:
    from: uno-web-biolerplate@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: ZjMzYTE0NGZiNjk4ZGNhZThkY2E2YWI2OTIwMWY1MTU4ZDljNzViMzAxOTgyYjkzMmRiYWZjY2EwMjgwMTYwODA2MTM1ZWUxMzFhYzk0OTA1ZjI0NzU5Nzc4ODRmNmNiMDIzOTc2ZGUwYTYzOTA0NDA5YWMxOWE3ZTJmZWZhMmY=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
#
# More documentation is available at:
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false
