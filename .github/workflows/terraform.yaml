name: "Deploy Container Image to ECS Fargate"
permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: read
  security-events: write
on:
  pull_request:
    branches:
      - develop
      - release/**/*
    paths:
      - infrastructure/**/*
      - "!**.md"
  push:
    branches:
      - develop
      - release/**/*
    paths:
      - infrastructure/**/*
      - "!**.md"
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Which Terraform action to take"
        required: true
        type: choice
        options:
          - apply
          - plan
          - destroy
      target_environment:
        description: "Which environment to deploy to"
        required: true
        type: choice
        options:
          - sandbox
          - test
          - stage
          - prod

jobs:
  # Disabled for now as we are not using the sandbox environment and certificate has expired
  # terraform-dev:
  #   name: "TF-dev"
  #   if: github.base_ref == 'develop' || github.ref == 'refs/heads/develop' || github.event.inputs.target_environment == 'sandbox'
  #   uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
  #   with:
  #     terraform_action: ${{ ( github.event_name == 'push' || github.event.inputs.terraform_action == 'apply' ) && 'apply' || github.event.inputs.terraform_action == 'destroy' && 'destroy' || 'plan' }}
  #     working_directory: "infrastructure"
  #     tfvars: "environment/dev.tfvars"
  #     env_file_name: "infrastructure/.env.dev"
  #     # post_init_commands: "terraform state list"
  #   secrets: inherit

  terraform-test-plan:
    name: "TF-Test-Plan"
    # Run on: PR created/updated (targeting develop or release), PR merged (push to develop), or manual run for test; exclude apply/destroy
    if: |
      (
        (github.event_name == 'pull_request' && (github.base_ref == 'develop' || startsWith(github.base_ref, 'release/'))) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'test')
      ) &&
      !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' || github.event.inputs.terraform_action == 'destroy')
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
    with:
      terraform_action: 'plan'
      working_directory: "infrastructure"
      tfvars: "environment/test.tfvars"
      env_file_name: "infrastructure/.env.test"
    secrets: inherit

  terraform-test-apply:
    name: "TF-Test-Apply" # This can also destroy, if specified
    if: (startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.target_environment != '') && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' || github.event.inputs.terraform_action == 'destroy')
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
    with:
      terraform_action: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' && 'apply' || github.event.inputs.terraform_action == 'destroy' && 'destroy' || 'error' }}
      working_directory: "infrastructure"
      tfvars: "environment/test.tfvars"
      env_file_name: "infrastructure/.env.test"
      environment: test
    secrets: inherit

  terraform-stage-plan:
    name: "TF-Stage-Plan"
    # Run if: we're targeting a release branch in a PR, or manually running the workflow on stage, AND we're not meeting the criteria for an apply
    if: (startsWith(github.base_ref, 'release/') || github.event.inputs.target_environment == 'stage') && !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' || github.event.inputs.terraform_action == 'destroy')
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
    with:
      terraform_action: 'plan'
      working_directory: "infrastructure"
      tfvars: "environment/stage.tfvars"
      env_file_name: "infrastructure/.env.stage"
    secrets: inherit

  terraform-stage-apply:
    needs: [terraform-test-apply]
    name: "TF-Stage-Apply" # This can also destroy, if specified
    if: ((startsWith(github.ref, 'refs/heads/release/') && github.event.inputs.target_environment == '') || github.event.inputs.target_environment == 'stage' || github.event.inputs.target_environment == 'prod' ) && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' || github.event.inputs.terraform_action == 'destroy')
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
    with:
      terraform_action: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' && 'apply' || github.event.inputs.terraform_action == 'destroy' && 'destroy' || 'plan' }}
      working_directory: "infrastructure"
      tfvars: "environment/stage.tfvars"
      env_file_name: "infrastructure/.env.stage"
      environment: stage
    secrets: inherit

  terraform-prod-plan:
     name: "TF-Prod-Plan"
     # Run if: we're targeting a release branch in a PR, or manually running the workflow on plan, AND we're not meeting the criteria for an apply
     if: (startsWith(github.base_ref, 'release/') || github.event.inputs.target_environment == 'prod') && !((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' || github.event.inputs.terraform_action == 'destroy')    
     uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
     with:
       terraform_action: 'plan'
       working_directory: "infrastructure"
       tfvars: "environment/prod.tfvars"
       env_file_name: "infrastructure/.env.prod"
     secrets: inherit

  terraform-prod-apply:
     needs: [terraform-stage-apply]
     name: "TF-Prod-Apply" # This can also destroy, if specified
     if: ((startsWith(github.ref, 'refs/heads/release/') && github.event.inputs.target_environment == '') || github.event.inputs.target_environment == 'prod') && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' || github.event.inputs.terraform_action == 'destroy')
     uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v2
     with:
       terraform_action: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || github.event.inputs.terraform_action == 'apply' && 'apply' || github.event.inputs.terraform_action == 'destroy' && 'destroy' || 'plan' }}
       working_directory: "infrastructure"
       tfvars: "environment/prod.tfvars"
       env_file_name: "infrastructure/.env.prod"
       environment: prod
     secrets: inherit

