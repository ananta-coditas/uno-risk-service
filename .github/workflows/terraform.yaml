# ---------------------------------------------------- #
# GitHub Actions Workflow: Build Infrastructure
#
# This workflow manages Terraform infrastructure deployments across multiple environments
# (int, test, stage, prod) for the service.
#
# Triggers:
# - Pull Request: Triggers on release branches when infrastructure files change
# - Push: Triggers on release branches when infrastructure files change  
# - Manual Dispatch: Allows manual execution with environment and action selection
#
# Jobs:
# - terraform-non-prod: Handles deployments to int/test environments via manual dispatch
# - terraform-stage: Handles stage environment deployments (auto-apply on release push, manual otherwise)
# - terraform-prod: Handles production deployments after stage completion (auto-apply on release push)
#
# The workflow uses reusable Terraform workflows and supports plan, apply, and destroy operations.
# Stage and prod environments are automatically deployed when pushing to release branches.
# ---------------------------------------------------- #
name: "Build & Deploy: Infrastructure"
# ---------------------------------------------------- #
permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: read
  security-events: write
# ---------------------------------------------------- #
on:
  pull_request:
    branches:
      - release/**/*
    paths:
      - infrastructure/**/*
      - "!**.md"
      - "!.github/workflows/**/*"
  push:
    branches:
      - release/**/*
    paths:
      - infrastructure/**/*
      - "!**.md"
      - "!.github/workflows/**/*"
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        default: test
        options:
          #- sandbox
          - test
          - stage
      terraform_action:
        description: "Terraform operation to execute"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
# ---------------------------------------------------- #
jobs:
  terraform-non-prod:
    # This job runs only on manual dispatch for non-stage environments (int, test, etc.)
    name: "TF-Non-Prod"
    if: (github.event_name == 'workflow_dispatch' &&  inputs.target_environment != 'stage')
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v3
    with:
      terraform_action: ${{ github.event.inputs.terraform_action }}
      working_directory: "infrastructure"
      tfvars: "environment/${{ inputs.target_environment }}.tfvars"
      env_file_name: "infrastructure/.env.${{ inputs.target_environment }}"
      environment: ${{ inputs.target_environment }}
    secrets: inherit

  terraform-stage:
    # This job runs on PR/push to release branches, or manual dispatch to stage environment on release branches
    name: "TF-Stage"
    if: |
      (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'stage' && startsWith(github.ref, 'refs/heads/release/'))
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v3
    with:
      terraform_action: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && 'apply' || github.event.inputs.terraform_action == 'destroy' && 'destroy' || github.event.inputs.terraform_action == 'apply' && 'apply' || 'plan' }}
      working_directory: "infrastructure"
      tfvars: "environment/stage.tfvars"
      env_file_name: "infrastructure/.env.stage"
      environment: stage
    secrets: inherit

  terraform-prod:
    # This job runs on PR/push to release branches, or manual dispatch to stage environment on release branches
    # It always runs after terraform-stage completes successfully
    needs: [terraform-stage]
    name: "TF-Prod"
    if: |
      (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'stage' && startsWith(github.ref, 'refs/heads/release/'))
    uses: ambrygen/github-reusable-workflows/.github/workflows/terraform-workflow-source.yaml@v3
    with:
      terraform_action: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && 'apply' || github.event.inputs.terraform_action == 'destroy' && 'destroy' || github.event.inputs.terraform_action == 'apply' && 'apply' || 'plan' }}
      working_directory: "infrastructure"
      tfvars: "environment/prod.tfvars"
      env_file_name: "infrastructure/.env.prod"
      environment: prod
    secrets: inherit
# ---------------------------------------------------- #
