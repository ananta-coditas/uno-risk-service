name: "POC: Snyk Scan Vendored JARs"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan (defaults to the branch you run the workflow from)"
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - "dependencies/**"
      - ".github/workflows/snyk-vendored-jars-poc.yaml"

permissions:
  contents: read

jobs:
  scan-vendored-jars:
    name: "Snyk scan-all-unmanaged (dependencies/)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master
        id: snyk
        with:
          snyk-version: latest

      - name: Print Snyk CLI version
        run: snyk --version

      - name: List vendored JARs
        run: find dependencies -type f -name '*.jar' | sort

      - name: Scan each JAR individually (debug)
        continue-on-error: true
        run: |
          set -uo pipefail
          for jar in dependencies/*.jar; do
            echo ""
            echo "========== $jar =========="
            snyk test -d --scan-unmanaged --file="$jar" --print-deps || echo "Scan failed or jar not identified: $jar"
          done
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Scan all vendored JARs (scan-all-unmanaged, debug)
        continue-on-error: true
        working-directory: dependencies
        run: snyk test -d --scan-all-unmanaged --print-deps
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Compare with Maven snyk test (full dependency tree)
        continue-on-error: true
        run: |
          bash .github/scripts/ci-install-local-maven-deps.sh
          snyk test -d --file=pom.xml --print-deps
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
