# Repo-local Snyk for vendored Maven deps. Org snyk-scan.yaml uses --all-projects, which
# triggers mvn dependency:tree --non-recursive and fails (exit -13) on this project.
name: Snyk Maven (uno-risk-service)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to scan (e.g. develop)"
        required: false
        type: string
        default: ""
      fail_on_severities:
        description: "Comma-separated severities to fail on"
        required: false
        type: string
        default: "critical"
      block_on_vulnerabilities:
        description: "Fail workflow when fail_on_severities are exceeded"
        required: false
        type: string
        default: "true"
    secrets:
      SNYK_TOKEN:
        required: true
    outputs:
      scan_status:
        description: "passed, failed, or vulnerabilities_found"
        value: ${{ jobs.scan.outputs.scan_status }}

jobs:
  scan:
    name: Snyk Maven Scan
    runs-on: ubuntu-latest
    outputs:
      scan_status: ${{ steps.check-thresholds.outputs.scan_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install local Maven dependencies
        run: bash .github/scripts/ci-install-local-maven-deps.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk test
        id: snyk-test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk test --json --file=pom.xml > snyk-results.json 2>snyk-errors.txt
          SNYK_EXIT=$?
          echo "Snyk test exit code: $SNYK_EXIT"
          if [ -s snyk-errors.txt ]; then
            echo "Snyk stderr:"
            cat snyk-errors.txt
          fi

          if ! jq empty snyk-results.json 2>/dev/null; then
            echo "critical_count=0" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            echo "medium_count=0" >> "$GITHUB_OUTPUT"
            echo "low_count=0" >> "$GITHUB_OUTPUT"
            echo "scan_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(jq -r '.ok // false' snyk-results.json)" != "true" ]; then
            echo "::error::Snyk could not resolve Maven dependencies"
            jq -r '.error // "unknown error"' snyk-results.json
            echo "critical_count=0" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            echo "medium_count=0" >> "$GITHUB_OUTPUT"
            echo "low_count=0" >> "$GITHUB_OUTPUT"
            echo "scan_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CRITICAL=$(jq -r '[.vulnerabilities[]? | select(.severity == "critical")] | length' snyk-results.json)
          HIGH=$(jq -r '[.vulnerabilities[]? | select(.severity == "high")] | length' snyk-results.json)
          MEDIUM=$(jq -r '[.vulnerabilities[]? | select(.severity == "medium")] | length' snyk-results.json)
          LOW=$(jq -r '[.vulnerabilities[]? | select(.severity == "low")] | length' snyk-results.json)
          echo "critical_count=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium_count=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low_count=$LOW" >> "$GITHUB_OUTPUT"
          echo "scan_ok=true" >> "$GITHUB_OUTPUT"
          echo "Counts: C=$CRITICAL H=$HIGH M=$MEDIUM L=$LOW"

      - name: Upload results to Snyk UI
        id: snyk-monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ "${{ steps.snyk-test.outputs.scan_ok }}" != "true" ]; then
            echo "Skipping monitor — dependency scan did not succeed"
            echo "snyk_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MONITOR_OUTPUT=$(snyk monitor --file=pom.xml 2>&1) || true
          echo "$MONITOR_OUTPUT"
          SNYK_URL=$(echo "$MONITOR_OUTPUT" | grep -oE 'https://app\.snyk\.io[^ ]+' | head -1)
          echo "snyk_url=${SNYK_URL:-}" >> "$GITHUB_OUTPUT"

      - name: Upload Snyk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sast-results
          path: snyk-results.json
          if-no-files-found: warn

      - name: Check vulnerability thresholds
        id: check-thresholds
        env:
          SNYK_URL: ${{ steps.snyk-monitor.outputs.snyk_url }}
        run: |
          if [ "${{ steps.snyk-test.outputs.scan_ok }}" != "true" ]; then
            echo "scan_status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Snyk dependency scan failed — see Run Snyk test step"
            exit 1
          fi

          CRITICAL="${{ steps.snyk-test.outputs.critical_count }}"
          HIGH="${{ steps.snyk-test.outputs.high_count }}"
          MEDIUM="${{ steps.snyk-test.outputs.medium_count }}"
          LOW="${{ steps.snyk-test.outputs.low_count }}"
          FAIL_ON="${{ inputs.fail_on_severities }}"
          BLOCK="${{ inputs.block_on_vulnerabilities }}"

          echo "Critical: $CRITICAL | High: $HIGH | Medium: $MEDIUM | Low: $LOW"
          if [ -n "$SNYK_URL" ]; then
            echo "Snyk project: $SNYK_URL"
          fi

          SHOULD_FAIL=false
          FAIL_REASON=""
          [[ "$FAIL_ON" == *"critical"* ]] && [ "${CRITICAL:-0}" -gt 0 ] && SHOULD_FAIL=true && FAIL_REASON="$CRITICAL critical"
          [[ "$FAIL_ON" == *"high"* ]] && [ "${HIGH:-0}" -gt 0 ] && SHOULD_FAIL=true && FAIL_REASON="${FAIL_REASON:+$FAIL_REASON, }$HIGH high"
          [[ "$FAIL_ON" == *"medium"* ]] && [ "${MEDIUM:-0}" -gt 0 ] && SHOULD_FAIL=true && FAIL_REASON="${FAIL_REASON:+$FAIL_REASON, }$MEDIUM medium"
          [[ "$FAIL_ON" == *"low"* ]] && [ "${LOW:-0}" -gt 0 ] && SHOULD_FAIL=true && FAIL_REASON="${FAIL_REASON:+$FAIL_REASON, }$LOW low"

          if [ "$SHOULD_FAIL" = true ] && [ "$BLOCK" = "true" ]; then
            echo "scan_status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Snyk failed: $FAIL_REASON"
            exit 1
          fi
          if [ "$SHOULD_FAIL" = true ]; then
            echo "scan_status=vulnerabilities_found" >> "$GITHUB_OUTPUT"
            echo "::warning::Snyk found $FAIL_REASON (block disabled)"
            exit 0
          fi
          echo "scan_status=passed" >> "$GITHUB_OUTPUT"
          echo "Snyk passed"
