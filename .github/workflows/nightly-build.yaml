name: "Nightly Build and send notification to Slack"
description: "Builds, scans, tests and sends notification to Slack."
on:
  schedule:
    # 5:00 AM PT: 12:00 UTC = 5 AM PDT (Mar–Nov), 4 AM PST (Nov–Mar). GitHub cron is UTC only.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run against (e.g. develop). Uses this repo's default branch if empty."
        required: false
        type: string
        default: "develop"
      slack_channel_id:
        description: "Slack channel ID for notifications (optional; uses vars.SLACK_CHANNEL_ID if empty)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write
  actions: read

jobs:
  # ===== CONFIGURATION: Update these values per app (same style as build_deploy_cos.yml) =====
  set-config:
    name: "Set Configuration"
    runs-on: ubuntu-latest
    env:
      # NOTE: These parameters must match the values in your tfvars / build_deploy_cos set-config
      ORGANIZATION_NAME: "ambry"
      APPLICATION_NAME: "uno-risk-service"
      #SERVICE_CONTAINER_MAPPING: '{"clinical-order-service": ["clinical-order-service"]}'
    outputs:
      organization_name: ${{ env.ORGANIZATION_NAME }}
      application_name: ${{ env.APPLICATION_NAME }}

    steps:
      - run: echo "Configuration set"

  nightly-deploy:
    name: "Nightly Build & Deploy"
    needs: [set-config]
    uses: ambrygen/github-reusable-workflows/.github/workflows/nightlydeploy.yaml@main
    with:
      # Required by reusable workflow
      service-name: ${{ needs.set-config.outputs.application_name }}
      target-branch: ${{ github.event.inputs.branch || 'develop' }}
      build-environment: "nightly"

      # Test coverage (align with build_deploy_cos / your app)
      enable-test-coverage: true
      java-version: "21"
      java-distribution: "temurin"
      coverage-threshold-line: 80
      coverage-threshold-branch: 40
      build-tool: "maven"
      maven-args: "-Dspring.profiles.active=test"
      working-directory: "."
      # Single-module repo: reusable workflow defaults to -pl backend. Override so root module is built (artifactId).
      maven-module: "."
      jacoco-report-path: "/target/site/jacoco/jacoco.xml"
      fail-on-coverage: true
      # Install local BOMs and JARs before tests (same as Dockerfile lines 15-33)
      install-dependencies: |
        mvn install:install-file -Dfile=./dependencies/uno-java-foundation-bom-1.0.1-SNAPSHOT.pom -DgroupId=com.ambry -DartifactId=uno-java-foundation-bom -Dversion=1.0.1-SNAPSHOT -Dpackaging=pom
        mvn install:install-file -Dfile=./dependencies/uno-spring-boot-foundation-bom-1.0.1-SNAPSHOT.pom -DgroupId=com.ambry -DartifactId=uno-spring-boot-foundation-bom -Dversion=1.0.1-SNAPSHOT -Dpackaging=pom
        mvn install:install-file -Dfile=./dependencies/uno-spring-boot-framework-0.0.2-SNAPSHOT.jar -DgroupId=com.ambry -DartifactId=uno-spring-boot-framework -Dversion=0.0.2-SNAPSHOT -Dpackaging=jar
        mvn install:install-file -Dfile=./dependencies/GailModel-0.0.1-SNAPSHOT.jar -DgroupId=com.progeny -DartifactId=GailModel -Dversion=0.0.1-SNAPSHOT -Dpackaging=jar
        mvn install:install-file -Dfile=./dependencies/REngine.jar -DgroupId=org.rosouda -DartifactId=REngine -Dversion=1.8.0_241 -Dpackaging=jar
        mvn install:install-file -Dfile=./dependencies/Rserve.jar -DgroupId=org.rosouda -DartifactId=Rserve -Dversion=1.8.0_241 -Dpackaging=jar
        mvn install:install-file -Dfile=./dependencies/RiskObjects-2.1.jar -DgroupId=com.objex -DartifactId=RiskObjects -Dversion=2.1 -Dpackaging=jar

      # Docker & Grype
      enable-docker-grype-scan: true
      dockerfile: "Dockerfile"
      env-file-name: "infrastructure/.env.shared_services"
      ecr-environment: "shared_services"
      fail-on-severities-grype: "critical"
      block-on-vulnerabilities: false
      enable-ecr-inspector-scan: true

      # Security scans
      enable-snyk-scan: true
      snyk-fail-on-severities: "critical"
      snyk-block-on-vulnerabilities: true
      enable-checkov-scan: true

      # Notifications
      enable-email-notifications: false
      enable-slack-notifications: true
      slack-channel-id: ${{ github.event.inputs.slack_channel_id || vars.SLACK_CHANNEL_ID || '' }}
      workflow-name: "Nightly Build & Deploy: ${{ needs.set-config.outputs.application_name }}"

      # Build and push to ECR (reusable runs this then deploy)
      enable-build-and-push: true
      enable-ecs-deploy: true
      deploy-env-file-name: "infrastructure/.env.test"
      deploy-github-environment: "test"
      deploy-cluster-name: "uno-test-cluster"
      deploy-core-container-name: "uno-risk-service-container"
      deploy-service-container-mapping: '{"uno-risk-service": ["uno-risk-service-container"]}'
      build-env-file-name: "infrastructure/.env.shared_services"
      build-github-environment: "shared_services"
      build-checkout-ref: ${{ github.event.inputs.branch || 'develop' }}
      build-args: |
        SPRING_PROFILES_ACTIVE=dev

      # ECS deploy to INT (runs only when collect-results AND build-and-push both succeed; if a scan/coverage job failed, deploy is skipped)
      # enable-ecs-deploy: false
    secrets: inherit

  # After INT ECS deploy succeeds, wait 10 minutes then dispatch RAS BDD tests in uno-regression-test-suite
  # (same inputs as manual workflow_dispatch: ref master + tags; ALS uses the same dispatch shape with a different default tag).
  dispatch-ras-regression-after-ecs:
    name: "Wait 10m then dispatch RAS regression (INT)"
    needs: [nightly-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ECS rollout to stabilize
        run: |
          echo "Nightly ECS deploy succeeded. Waiting 10 minutes before triggering RAS regression tests..."
          sleep 600
      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.WF_DISPATCH_APP_ID }}
          private-key: ${{ secrets.WF_DISPATCH_PRIVATE_KEY }}
          owner: ambrygen
          repositories: |
            uno-regression-test-suite
          permission-actions: write
      - name: Dispatch RAS automation workflow
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          body="$(jq -nc \
            --arg ref "master" \
            --arg tags "@RiskAssessmentService" \
            '{ref: $ref, inputs: {tags: $tags}}')"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ambrygen/uno-regression-test-suite/actions/workflows/ras-automation-tests.yml/dispatches" \
            -d "${body}"
          echo "::notice::RAS regression tests dispatched — see ambrygen/uno-regression-test-suite → Actions."